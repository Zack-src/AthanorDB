<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NebulaDB Refonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: coque unique (barre latérale + fil d'Ariane), un seul niveau d'onglets, panneaux latéraux à la place des popups. */
:root {
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --bg: #eeece7; --canvas: #e8e5df; --s1: #f6f4f0; --s2: #fbfaf7; --s3: #e7e4dd;
  --text: #1f1e1b; --text2: #47443e; --muted: #5c5850; --disabled: #8e8a80;
  --line-subtle: #ddd9d0; --line: #cfcabf; --line-control: #837e73; --line-strong: #625e55;
  --primary: #4a4fa6; --primary-hover: #3e4392; --primary-text: #3e4392; --primary-subtle: #e3e4f2; --primary-line: #b3b6dc; --on-primary: #fff;
  --ok: #2b6e4c; --ok-text: #22573c; --ok-bg: #dfebe2; --ok-line: #a9cbb5;
  --warn: #8a5410; --warn-text: #6e410b; --warn-bg: #f2e6d2; --warn-line: #d7b98a;
  --bad: #b03a33; --bad-text: #8e2d27; --bad-bg: #f4deda; --bad-line: #dda9a3;
  --info: #2a6a98; --info-text: #1f5379; --info-bg: #dce9f2; --info-line: #a4c2d9;
  --lock-text: #464c58; --lock-bg: #e3e5e8; --lock-line: #b9bec6;
  --ed-bg: #f9f8f4; --ed-gutter: #6f6b62; --ed-active: #efede7; --ed-sel: #cfd2ee;
  --sy-com: #6a665d; --sy-key: #7a3fa6; --sy-type: #0f6b73; --sy-str: #2b6e4c; --sy-num: #a24a12; --sy-op: #b03872; --sy-id: #2a5fb0;
  --d1: #46505e; --d2: #4a4fa6; --d3: #2f6a9b; --d4: #1f6f78; --d5: #3a7050; --d6: #66701f; --d7: #85650f; --d8: #a24e1a; --d9: #a9423b; --d10: #a04570; --d11: #7647a0; --d12: #6b665c;
  --e1: #2a6c4d; --e2: #4a4fa6; --e3: #8e5c10; --grid: #bdb8ad;
  --sh1: 0 1px 2px rgba(60,50,30,.10), 0 0 0 1px rgba(60,50,30,.04);
  --sh2: 0 4px 14px rgba(60,50,30,.14), 0 1px 3px rgba(60,50,30,.08);
  --sh3: 0 16px 40px rgba(60,50,30,.20), 0 4px 12px rgba(60,50,30,.10);
  --overlay: rgba(31,30,27,.42);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --canvas: #13161c; --s1: #181b22; --s2: #1f232c; --s3: #282d38;
  --text: #ecedf1; --text2: #b0b5c2; --muted: #929aab; --disabled: #5e6474;
  --line-subtle: #262b35; --line: #333947; --line-control: #7c8499; --line-strong: #a0a7b8;
  --primary: #4f53cf; --primary-hover: #5d61db; --primary-text: #a9adff; --primary-subtle: #25284d; --primary-line: #4a4f96;
  --ok: #2e7d57; --ok-text: #7ad0a0; --ok-bg: #17302a; --ok-line: #2f6b4e;
  --warn: #946009; --warn-text: #e8b766; --warn-bg: #352a17; --warn-line: #7a5a22;
  --bad: #c2433b; --bad-text: #f2918a; --bad-bg: #3a1e22; --bad-line: #8a3a3a;
  --info: #2e71a6; --info-text: #7dbceb; --info-bg: #182d3d; --info-line: #356a94;
  --lock-text: #b0b7c6; --lock-bg: #252a33; --lock-line: #566074;
  --ed-bg: #14171d; --ed-gutter: #858da4; --ed-active: #1b1f27; --ed-sel: #34397a;
  --sy-com: #8790a3; --sy-key: #d2a0f0; --sy-type: #5fc7d2; --sy-str: #9ed08a; --sy-num: #e0a878; --sy-op: #f08ab8; --sy-id: #74b6f5;
  --d2: #5a5ec4; --d1: #5f6b7c; --d11: #8257b3;
  --e1: #6cc796; --e2: #9a9ef7; --e3: #e0ad5a; --grid: #2e3441;
  --sh1: 0 1px 2px rgba(0,0,0,.40); --sh2: 0 6px 16px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.30); --sh3: 0 20px 48px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.32);
  --overlay: rgba(5,6,9,.66); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1115; --canvas: #13161c; --s1: #181b22; --s2: #1f232c; --s3: #282d38;
  --text: #ecedf1; --text2: #b0b5c2; --muted: #929aab; --disabled: #5e6474;
  --line-subtle: #262b35; --line: #333947; --line-control: #7c8499; --line-strong: #a0a7b8;
  --primary: #4f53cf; --primary-hover: #5d61db; --primary-text: #a9adff; --primary-subtle: #25284d; --primary-line: #4a4f96;
  --ok: #2e7d57; --ok-text: #7ad0a0; --ok-bg: #17302a; --ok-line: #2f6b4e;
  --warn: #946009; --warn-text: #e8b766; --warn-bg: #352a17; --warn-line: #7a5a22;
  --bad: #c2433b; --bad-text: #f2918a; --bad-bg: #3a1e22; --bad-line: #8a3a3a;
  --info: #2e71a6; --info-text: #7dbceb; --info-bg: #182d3d; --info-line: #356a94;
  --lock-text: #b0b7c6; --lock-bg: #252a33; --lock-line: #566074;
  --ed-bg: #14171d; --ed-gutter: #858da4; --ed-active: #1b1f27; --ed-sel: #34397a;
  --sy-com: #8790a3; --sy-key: #d2a0f0; --sy-type: #5fc7d2; --sy-str: #9ed08a; --sy-num: #e0a878; --sy-op: #f08ab8; --sy-id: #74b6f5;
  --d2: #5a5ec4; --d1: #5f6b7c; --d11: #8257b3;
  --e1: #6cc796; --e2: #9a9ef7; --e3: #e0ad5a; --grid: #2e3441;
  --sh1: 0 1px 2px rgba(0,0,0,.40); --sh2: 0 6px 16px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.30); --sh3: 0 20px 48px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.32);
  --overlay: rgba(5,6,9,.66); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* coque */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100%; }
.side { background: var(--s1); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 600; font-size: 14px; letter-spacing: .01em; }
.brand b { width: 26px; height: 26px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 9px; border-radius: 7px; color: var(--text2); text-align: left; }
.nav button:hover { background: var(--s3); }
.nav button[aria-current="page"] { background: var(--primary-subtle); color: var(--primary-text); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 11px; background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-line); padding: 0 6px; border-radius: 9px; }
.side .grow { flex: 1; }
.side h6 { margin: 12px 9px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.me { display: flex; align-items: center; gap: 9px; padding: 8px; border-top: 1px solid var(--line); margin-top: 6px; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--d10); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-control); border-radius: 7px; overflow: hidden; background: var(--s2); }
.seg button { border: 0; background: none; padding: 3px 9px; font-size: 12px; color: var(--text2); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--s1); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--text); font-weight: 600; }
.sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-control); background: var(--s2); border-radius: 8px; padding: 5px 10px; color: var(--muted); min-width: 220px; }
.kbd { font: 11px var(--mono); border: 1px solid var(--line-control); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text2); background: var(--s2); }
.view { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: auto; }
.pad { padding: 20px 24px 40px; max-width: 1180px; }

/* éléments */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-control); background: var(--s2); border-radius: 7px; padding: 5px 11px; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--s3); }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 500; }
.btn.pri:hover { background: var(--primary-hover); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--s3); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 30px; height: 30px; padding: 0; justify-content: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 18px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--s3); color: var(--text2); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-line); }
.pill.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-line); }
.pill.bad { background: var(--bad-bg); color: var(--bad-text); border-color: var(--bad-line); }
.pill.info { background: var(--info-bg); color: var(--info-text); border-color: var(--info-line); }
.pill.lock { background: var(--lock-bg); color: var(--lock-text); border-color: var(--lock-line); }
.pill.pri { background: var(--primary-subtle); color: var(--primary-text); border-color: var(--primary-line); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.card { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh1); }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--s1); }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line-subtle); vertical-align: middle; }
table.t tbody tr:hover { background: var(--s1); }
table.t tr.click { cursor: pointer; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 24px; background: var(--s1); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--primary-text); border-bottom-color: var(--primary-text); font-weight: 600; }
.note { position: absolute; right: 16px; bottom: 16px; z-index: 30; max-width: 330px; }
.note > button { float: right; }
.note .body { margin-top: 8px; background: var(--s2); border: 1px solid var(--primary-line); border-radius: 10px; box-shadow: var(--sh3); padding: 12px 14px; }
.note ul { margin: 6px 0 0; padding-left: 18px; color: var(--text2); }
.note li { margin: 3px 0; }

/* éditeur de schéma */
.proj-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--s1); min-width: 0; }
.proj-head .tabsi { display: flex; gap: 2px; margin-left: 6px; min-width: 0; overflow-x: auto; }
.proj-head .tabsi button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.proj-head .tabsi button[aria-selected="true"] { background: var(--primary-subtle); color: var(--primary-text); font-weight: 600; }
.ws { display: grid; grid-template-columns: minmax(0, 1fr) auto; flex: 1; min-height: 0; }
.cv { position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-width: 0; }
.cv svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tbl { position: absolute; width: 224px; background: var(--s2); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--sh2); font-size: 12px; user-select: none; }
.tbl.sel { outline: 2px solid var(--primary-text); outline-offset: 2px; }
.tbl .th { display: flex; align-items: center; gap: 6px; padding: 7px 8px; color: #fff; border-radius: 7px 7px 0 0; cursor: grab; font-weight: 600; }
.tbl .th .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .th .ic { opacity: .92; }
.tbl .th button { border: 0; background: none; color: #fff; padding: 2px; border-radius: 4px; display: grid; place-items: center; }
.tbl .th button:hover { background: rgba(255,255,255,.22); }
.tbl .cr { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-top: 1px solid var(--line-subtle); cursor: pointer; }
.tbl .cr:hover { background: var(--s1); }
.tbl .cr.sel { background: var(--primary-subtle); }
.tbl .cr .ty { margin-left: auto; color: var(--muted); font: 11px var(--mono); }
.tbl .cr .k { width: 16px; font-size: 9.5px; font-weight: 700; color: var(--warn-text); }
.tbl .cr .k.fk { color: var(--info-text); }
.floatbar { position: absolute; z-index: 20; display: flex; gap: 2px; padding: 3px; background: var(--s2); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--sh3); }
.floatbar .sepv { width: 1px; background: var(--line); margin: 3px 3px; }
.dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; background: var(--s2); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: var(--sh2); z-index: 15; }
.dock button { width: 32px; height: 32px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--text2); position: relative; }
.dock button:hover { background: var(--s3); }
.dock button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.dock .sepv { width: 1px; background: var(--line); margin: 5px 3px; }
.dock button span.k { position: absolute; right: 2px; bottom: 0; font: 8px var(--mono); opacity: .7; }
.insp { width: 320px; background: var(--s1); border-left: 1px solid var(--line); overflow-y: auto; }
.insp[hidden] { display: none; }
.insp .hd { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.insp .sec { padding: 12px 14px; border-bottom: 1px solid var(--line-subtle); }
.insp label.f { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
.in { width: 100%; background: var(--s2); border: 1px solid var(--line-control); border-radius: 6px; padding: 5px 8px; color: var(--text); font: inherit; }
.sw { display: flex; gap: 5px; flex-wrap: wrap; }
.sw button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--s2); box-shadow: 0 0 0 1px var(--line-control); padding: 0; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
.stat { height: 26px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--s1); color: var(--muted); font-size: 12px; }
.stat button { border: 0; background: none; color: var(--text2); display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 5px; }
.stat button:hover { background: var(--s3); }
.ctx { position: fixed; z-index: 90; min-width: 210px; background: var(--s2); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--sh3); padding: 4px; }
.ctx button { display: flex; width: 100%; align-items: center; gap: 9px; border: 0; background: none; padding: 6px 9px; border-radius: 6px; text-align: left; }
.ctx button:hover { background: var(--primary-subtle); color: var(--primary-text); }
.ctx button.dng { color: var(--bad-text); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.ctx .k { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.pop { position: absolute; z-index: 40; min-width: 250px; background: var(--s2); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--sh3); padding: 4px; }
.pop button { display: flex; width: 100%; gap: 9px; align-items: center; border: 0; background: none; padding: 7px 9px; border-radius: 6px; text-align: left; }
.pop button:hover { background: var(--primary-subtle); color: var(--primary-text); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pop .lab { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 6px 9px 2px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 100; background: var(--text); color: var(--bg); padding: 9px 12px 9px 14px; border-radius: 9px; box-shadow: var(--sh3); display: flex; gap: 14px; align-items: center; }
.toast button { background: none; border: 0; color: var(--primary-line); font-weight: 600; padding: 0; text-decoration: underline; }

/* SQL */
.sql { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100%; }
.tree { background: var(--s1); border-right: 1px solid var(--line); overflow: auto; padding: 8px 6px; font-size: 12.5px; }
.tree details { margin-left: 12px; }
.tree > details { margin-left: 0; }
.tree summary { cursor: pointer; padding: 3px 6px; border-radius: 5px; list-style: none; display: flex; align-items: center; gap: 6px; color: var(--text2); }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover, .tree .leaf:hover { background: var(--s3); }
.tree .leaf { margin-left: 24px; padding: 3px 6px; border-radius: 5px; display: flex; gap: 6px; align-items: center; color: var(--text2); cursor: pointer; }
.tree .leaf .ty { margin-left: auto; color: var(--muted); font: 11px var(--mono); }
.qa { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.qtabs { display: flex; background: var(--s1); border-bottom: 1px solid var(--line); overflow-x: auto; }
.qtabs button { border: 0; border-right: 1px solid var(--line-subtle); background: none; padding: 7px 12px; display: flex; gap: 8px; align-items: center; color: var(--muted); white-space: nowrap; }
.qtabs button[aria-selected="true"] { background: var(--s2); color: var(--text); box-shadow: inset 0 -2px var(--primary-text); }
.qbar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--s1); flex-wrap: wrap; }
.banner { display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid; font-weight: 500; }
.banner.bad { background: var(--bad-bg); color: var(--bad-text); border-color: var(--bad-line); }
.banner.info { background: var(--info-bg); color: var(--info-text); border-color: var(--info-line); }

function parseDbml(src) {

  lines.forEach((ln, i) => {

function fakeId(n, i) { let x = 7; for (const ch of n) x = (x * 31 + ch.charCodeAt(0)) >>> 0; const a = (x * 2654435761 + (i + 1) * 40503) >>> 0; const h = a.toString(16).padStart(8, '0'); return `${h}-${h.slice(0, 4)}-4${h.slice(1, 4)}-a${h.slice(2, 5)}-${h}${h.slice(0, 4)}`; }

  if (S.res === 'Plan') return `<div class="plan">Limit  <span class="cost">(cost=412.8..412.9 rows=20)</span><br>&nbsp;└ Sort  <span class="cost">(cost=412.8..415.3 rows=1003)</span> · total DESC<br>&nbsp;&nbsp;&nbsp;└ HashAggregate  <span class="cost">(cost=368.2..385.9 rows=1003)</span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└ Hash Join  <span class="cost">(cost=62.4..301.7 rows=8412)</span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├ Seq Scan sur orders  <span class="cost">(cost=0.00..198.4 rows=8412)</span> · filtre status = 'paid'<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└ Seq Scan sur customers<br><br><span style="color:var(--warn-text)">⚠ Analyse sur orders : parcours séquentiel. Un index sur (status, placed_at) l'éviterait.</span><br><span class="muted">Plan estimé. L'analyse réelle demande le mode écriture, dans une transaction annulée.</span></div>`;
  return `<table><thead><tr><th>name</th><th>commandes</th><th>total</th></tr></thead><tbody>${ROWS.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join('')}</tbody></table>`;

function openPal() {
  const L = $('#layer'); L.innerHTML = '';
  const cmds = [['home', 'Aller à l\'accueil', 'home'], ['folder', 'Aller aux projets', 'projects'], ['tbl', 'Ouvrir le schéma de Boutique en ligne', 'schema'], ['db', 'Aller aux bases', 'bases'], ['term', 'Nouvelle requête SQL', 'sql'], ['users', 'Administration : utilisateurs', 'a:Utilisateurs'], ['hook', 'Administration : webhooks', 'a:Webhooks'], ['key', 'Administration : clés d\'API', 'a:Clés d\'API'], ['shield', 'Administration : sécurité', 'a:Sécurité'], ['cog', 'Mes paramètres', 's:Profil'], ['sparkle', 'Paramètres d\'apparence (thème, densité)', 's:Apparence'], ['key', 'Mes clés d\'API', 's:Clés d\'API'], ['rocket', 'Déployer le projet', 'x']];
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="pal" role="dialog" aria-label="Palette de commandes"><input id="pq" placeholder="Que voulez-vous faire ?" aria-label="Commande" autocomplete="off"><ul id="pl" role="listbox"></ul></div>`;
  L.appendChild(sc); let idx = 0, list = cmds;
  const draw = () => { $('#pl').innerHTML = list.map((c, i) => `<li role="option" aria-selected="${i === idx}" data-i="${i}">${ic(c[0])}<span>${c[1]}</span><small>${c[2] === 'x' ? '' : 'Entrée'}</small></li>`).join('') || '<li class="muted">Aucune commande</li>'; $$('#pl li[data-i]').forEach(li => li.onclick = () => run(list[+li.dataset.i])); };
  const run = c => { if (!c) return; L.innerHTML = ''; if (c[2].startsWith('a:')) { S.admSec = c[2].slice(2); go('admin'); } else if (c[2].startsWith('s:')) { S.setSec = c[2].slice(2); go('settings'); } else if (c[2] === 'x') toast(c[1] + ' : disponible depuis cette palette'); else go(c[2]); };
  $('#pq').oninput = e => { const q = e.target.value.toLowerCase(); list = cmds.filter(c => c[1].toLowerCase().includes(q)); idx = 0; draw(); };
  $('#pq').onkeydown = e => { if (e.key === 'ArrowDown') { idx = Math.min(list.length - 1, idx + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') run(list[idx]); else if (e.key === 'Escape') L.innerHTML = ''; };
  sc.onclick = e => { if (e.target === sc) L.innerHTML = ''; };
  draw(); $('#pq').focus();
}

const TYMAP = { 'SQL Server': { uuid: 'UNIQUEIDENTIFIER', varchar: 'NVARCHAR', timestamptz: 'DATETIMEOFFSET', numeric: 'DECIMAL', int: 'INT', order_status: 'NVARCHAR(20)' }, MySQL: { uuid: 'CHAR(36)', varchar: 'VARCHAR', timestamptz: 'DATETIME', numeric: 'DECIMAL', int: 'INT', order_status: 'ENUM(...)' }, Oracle: { uuid: 'RAW(16)', varchar: 'VARCHAR2', timestamptz: 'TIMESTAMP WITH TIME ZONE', numeric: 'NUMBER', int: 'NUMBER(10)', order_status: 'VARCHAR2(20)' }, SQLite: { uuid: 'TEXT', varchar: 'TEXT', timestamptz: 'TEXT', numeric: 'REAL', int: 'INTEGER', order_status: 'TEXT' }, PostgreSQL: { uuid: 'uuid', varchar: 'varchar', timestamptz: 'timestamptz', numeric: 'numeric', int: 'int', order_status: 'order_status' } };

}

const TOUR = [['.side', 'Une seule navigation', 'Accueil, Projets, Bases, Requêtes, Administration. Le thème et vos réglages sont dans Paramètres.'], ['.proj-head', 'Un en-tête unique', 'Le menu Projet regroupe import, export et comparaison. Déployer est la seule action principale.'], ['#cv', 'Le canvas', 'Cliquez une table pour voir sa barre d\'actions et son inspecteur. Clic droit pour le menu contextuel.'], ['#dbml', 'DBML synchronisé', 'Le code et le diagramme restent identiques dans les deux sens. Ctrl B pour l\'afficher.'], ['#openPal', 'Palette de commandes', 'Ctrl K trouve une page, une table, une personne ou une action.']];

  const L = $('#layer'); L.innerHTML = '';
  const cmds = [['Aller à', 'home', 'Accueil', 'home'], ['Aller à', 'folder', 'Projets', 'projects'], ['Aller à', 'db', 'Bases', 'bases'], ['Aller à', 'term', 'Requêtes', 'sql'], ['Aller à', 'shield', 'Administration', 'admin'], ['Aller à', 'alert', 'Notifications', 'notifications'],
    ['Projet', 'tbl', 'Boutique en ligne · Schéma', 'schema'], ['Projet', 'rocket', 'Déployer le projet', 't:Déployer'], ['Projet', 'up', 'Importer…', 't:Importer'], ['Projet', 'file', 'Exporter…', 't:Exporter'], ['Projet', 'copy', 'Comparer…', 't:Comparer'], ['Projet', 'file', 'Dictionnaire de données', 't:Dictionnaire'], ['Projet', 'check', 'Qualité du schéma', 't:Qualité'],
    ['Table', 'tbl', 'customers', 'tb:customers'], ['Table', 'tbl', 'orders', 'tb:orders'], ['Table', 'tbl', 'order_lines', 'tb:order_lines'], ['Table', 'tbl', 'products', 'tb:products'], ['Table', 'tbl', 'addresses', 'tb:addresses'],
    ['Base', 'db', 'Boutique live', 'ba:live'], ['Base', 'db', 'Boutique recette', 'ba:stg'], ['Personne', 'users', 'Marc Delorme', 'a:Utilisateurs'], ['Personne', 'users', 'Inès Charpentier', 'a:Utilisateurs'],
    ['Requête', 'file', 'Commandes du mois', 'sql'], ['Admin', 'users', 'Utilisateurs', 'a:Utilisateurs'], ['Admin', 'hook', 'Webhooks', 'a:Webhooks'], ['Admin', 'key', 'Clés d\'API', 'a:Clés d\'API'], ['Admin', 'shield', 'Sécurité', 'a:Sécurité'], ['Admin', 'cloud', 'Sauvegardes', 'a:Sauvegardes'],
    ['Compte', 'cog', 'Mes paramètres', 's:Profil'], ['Compte', 'sparkle', 'Apparence (thème, densité)', 's:Apparence'], ['Compte', 'key', 'Mes clés d\'API', 's:Clés d\'API'], ['Compte', 'info', 'Raccourcis clavier et aide', 's:Raccourcis et aide'], ['Compte', 'sparkle', 'Faire la visite guidée', 'tour']];
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="pal" role="dialog" aria-label="Palette de commandes"><input id="pq" placeholder="Page, projet, table, base, personne, action…" aria-label="Commande" autocomplete="off"><ul id="pl" role="listbox"></ul><div class="muted" style="padding:6px 14px;border-top:1px solid var(--line);font-size:11.5px">↑ ↓ pour choisir · Entrée pour ouvrir · Échap pour fermer</div></div>`;
  L.appendChild(sc); let idx = 0, list = cmds;
  const draw = () => { $('#pl').innerHTML = list.map((c, i) => `<li role="option" aria-selected="${i === idx}" data-i="${i}">${ic(c[1])}<span>${c[2]}</span><small>${c[0]}</small></li>`).join('') || '<li class="muted">Aucun résultat</li>'; $$('#pl li[data-i]').forEach(li => li.onclick = () => run(list[+li.dataset.i])); };
  const run = c => {
    if (!c) return; L.innerHTML = ''; const k = c[3];
    if (k.startsWith('a:')) { S.admSec = k.slice(2); go('admin'); } else if (k.startsWith('s:')) { S.setSec = k.slice(2); go('settings'); }
    else if (k.startsWith('t:')) { S.tab = k.slice(2); if (S.tab === 'Déployer') S.dep = null; go('schema'); }
    else if (k.startsWith('tb:')) { S.tab = 'Schéma'; go('schema'); setTimeout(() => { S.sel = k.slice(3); panTo(S.sel); drawTables(); drawInsp(); }, 80); }
    else if (k.startsWith('ba:')) { S.baseId = k.slice(3); go('bases'); S.baseOpen = true; S.baseTab = 'Vue d\'ensemble'; crumbs(); render(); }
    else if (k === 'tour') tourStart(); else go(k);
  };
  $('#pq').oninput = e => { const q = e.target.value.toLowerCase(); list = cmds.filter(c => (c[0] + ' ' + c[2]).toLowerCase().includes(q)); idx = 0; draw(); };
  $('#pq').onkeydown = e => { if (e.key === 'ArrowDown') { idx = Math.min(list.length - 1, idx + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') run(list[idx]); else if (e.key === 'Escape') L.innerHTML = ''; };
  sc.onclick = e => { if (e.target === sc) L.innerHTML = ''; };
  draw(); $('#pq').focus();
}


function mcdMark(a, b, xm, ya, yb, x1, x2) {
  const cy = (ya + yb) / 2, lab = ASSOC[a + '-' + b] || 'associé', right = x1 < x2;
  return '<g><path d="M' + xm + ' ' + (cy - 16) + ' l30 16 l-30 16 l-30 -16z" fill="var(--s2)" stroke="var(--line-strong)" stroke-width="1.5"/><text x="' + xm + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="11" fill="var(--text)" font-family="IBM Plex Sans, sans-serif">' + lab + '</text><text x="' + (x1 + (right ? 6 : -6)) + '" y="' + (ya - 6) + '" text-anchor="' + (right ? 'start' : 'end') + '" font-size="10.5" fill="var(--muted)">1,1</text><text x="' + (x2 + (right ? -6 : 6)) + '" y="' + (yb - 6) + '" text-anchor="' + (right ? 'end' : 'start') + '" font-size="10.5" fill="var(--muted)">0,N</text></g>';
}

/* ---------- thème ---------- */
function setTheme(t) {
  S.theme = t; const r = document.documentElement; if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  $$('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === t));
  setTimeout(() => { if (S.view === 'schema') edges(); }, 0);
}
$('#openPal').onclick = openPal;
$('#bell').onclick = e => popMenu(e.currentTarget, [['lab', 'Notifications'], ['note', 'Marc vous a mentionné dans « orders »', 'il y a 12 min'], ['alert', '2 écarts sur Boutique recette', '20 min'], ['users', 'Camille n\'a pas encore accepté', '2 j'], ['hr'], ['list', 'Voir toutes les notifications', '', () => go('notifications')], ['check', 'Tout marquer comme lu'], ['cog', 'Régler les notifications', '', () => { S.setSec = 'Notifications'; go('settings'); }]]);
$('#meBtn').onclick = e => popMenu(e.currentTarget, [['lab', 'Élise Arnaud'], ['cog', 'Paramètres', '', () => { S.setSec = 'Profil'; go('settings'); }], ['key', 'Mes clés d\'API', '', () => { S.setSec = 'Clés d\'API'; go('settings'); }], ['db', 'Mes comptes SQL', '', () => { S.setSec = 'Mes comptes SQL'; go('settings'); }], ['hr'], ['info', 'Aide et raccourcis', '', () => { S.setSec = 'Raccourcis et aide'; go('settings'); }], ['x', 'Se déconnecter']], true);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); if (S.view === 'schema' && S.tab === 'Schéma') toggleSqld(); else go('sql'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b' && S.view === 'schema' && S.tab === 'Schéma') { e.preventDefault(); toggleDbml(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && S.view === 'schema' && S.tab === 'Schéma') { e.preventDefault(); findPop(); return; }
  if (e.key === 'F5' && S.view === 'schema' && S.sqld.open && S.sqld.tab === 'Requête') { e.preventDefault(); const r = $('#sqrun'); if (r) r.click(); return; }
  if (e.key === 'F5' && S.view === 'sql') { e.preventDefault(); const r = $('#run'); if (r && !r.disabled) r.click(); }
  if (e.key === 'Escape') { closeFloaters(); hideDrawer(); }
  if ((e.key === 'Delete') && S.view === 'schema' && S.selCol && !/INPUT/.test(document.activeElement.tagName)) delCol();
});
window.addEventListener('resize', () => { if (S.view === 'schema') edges(); });
const h0 = (location.hash || '').slice(1); if (['home', 'projects', 'schema', 'bases', 'sql', 'admin', 'settings', 'notifications'].includes(h0)) S.view = h0;
renderNav(); crumbs(); render(); if (S.view === 'schema') setTimeout(edges, 50);
</script>
