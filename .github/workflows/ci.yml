name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Throwaway Postgres/MySQL for the connections/deployment driver tests
    # (apps/server/src/modules/connections/drivers/{postgres,mysql}.test.ts).
    # Same ports/credentials as docker-compose.test.yml, which contributors
    # use to run the same tests locally — see that file for details. Without
    # these, those two test files skip themselves rather than fail.
    services:
      athanordb-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: athanordb_test
          POSTGRES_PASSWORD: athanordb_test
          POSTGRES_DB: athanordb_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U athanordb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      athanordb-test-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: athanordb_test
          MYSQL_DATABASE: athanordb_test
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pathanordb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines range in package.json; better-sqlite3 builds
          # from source here, so the Node major has to be one it supports.
          node-version: 22
          cache: npm

      # `npm ci` runs the root postinstall, which builds packages/shared and
      # packages/dbml-engine — everything downstream depends on those.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Blocking, not `continue-on-error`: unlike the audit step below, this
      # starts clean (0 cycles across all four workspaces) rather than with a
      # pre-existing finding to grandfather in, so there's nothing to ignore.
      - name: Check for circular dependencies
        run: npm run check:circular

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Catches a newly-published advisory in a dependency before it is found
      # by hand months later. `--audit-level=high` deliberately: the repo
      # currently carries one known moderate finding (esbuild's dev server,
      # reachable only when running `npm run dev`, fixable only by a Vite major
      # — tracked in docs/todo.md), and a gate that is red on day one gets
      # ignored. `continue-on-error` keeps a fresh advisory from blocking an
      # unrelated PR while still flagging it in the run summary.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
