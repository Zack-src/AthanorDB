# SQL Server instance for manual testing of Nebula's MSSQL connections.
# Separate from docker-compose.yml / docker-compose.test.yml.
#
# Usage:
#   docker compose -f docker-compose.mssql.yml up -d
#   docker compose -f docker-compose.mssql.yml down      # keeps data
#   docker compose -f docker-compose.mssql.yml down -v   # wipes data
services:
  nebuladb-test-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nebuladb-test-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Nebula_Test123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - nebuladb-test-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nebuladb-test-mssql-data:
